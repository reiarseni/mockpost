name: MCP Registry

# Publishing to the MCP Registry used to be a manual step with an interactive
# `mcp-publisher login github`. GitHub Actions can authenticate with OIDC
# instead, so the registry entry now follows every tag by itself.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the version from server.json
        id: version
        run: echo "value=$(jq -r .version server.json)" >> "$GITHUB_OUTPUT"

      - name: Check server.json matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "${{ steps.version.outputs.value }}" ]; then
            echo "tag $tag does not match server.json ${{ steps.version.outputs.value }}" >&2
            exit 1
          fi

      - name: Wait for the release on PyPI
        # The registry validates ownership by reading the mcp-name marker in
        # the published PyPI README, so the package has to be there first.
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS "https://pypi.org/pypi/mockpost/${{ steps.version.outputs.value }}/json" >/dev/null; then
              echo "mockpost ${{ steps.version.outputs.value }} is on PyPI"
              exit 0
            fi
            sleep 10
          done
          echo "mockpost ${{ steps.version.outputs.value }} never showed up on PyPI" >&2
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher

      - name: Publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
